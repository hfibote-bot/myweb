<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>温室大棚计算与工程图</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    .field input,.field select,.field textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text)}
    .field textarea{min-height:96px;font-family:ui-monospace,Consolas,monospace}
    .table{width:100%;border-collapse:collapse;margin-top:12px}
    .table th,.table td{border-bottom:1px solid var(--line);padding:8px;font-size:13px;text-align:left}
    .out{margin-top:16px}
    .canvas-wrap{background:rgba(0,0,0,.15);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:10px}
    .actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .hint{font-size:12px;color:var(--muted)}
    .draw-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
    @media (max-width: 980px){.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h2>温室预算助手（升级版）</h2>
      <p class="sub">不再显示客户隐私和价格。支持普通棚/联动棚、更多作物、材料类型选择、可读性更高的图纸。</p>
      <div class="form-grid">
        <div class="field"><label>材料档次</label><select id="grade"><option value="std">经济型</option><option value="pro" selected>耐用型（推荐）</option><option value="premium">高配型</option></select></div>
        <div class="field"><label>管材类型</label><select id="pipeType"><option value="round" selected>圆管</option><option value="ellipse">椭圆管（抗风更好）</option><option value="galvanized">热镀锌加厚管</option></select></div>
        <div class="field"><label>覆盖膜类型</label><select id="coverType"><option value="po" selected>PO膜</option><option value="eva">EVA膜</option><option value="pe">PE膜</option></select></div>
        <div class="field"><label>种植作物</label><select id="crop"><option value="grape" selected>葡萄</option><option value="vegetable">蔬菜</option><option value="berry">草莓</option><option value="flower">花卉</option><option value="seedling">育苗</option><option value="melon">瓜果</option></select></div>
      </div>
      <div class="field" style="margin-top:10px">
        <label>大棚参数（可混合填写普通棚和联动棚，不展示计算过程）</label>
        <textarea id="specs">[
  {"type":"normal","width":6,"length":74.3,"count":4},
  {"type":"linked","width":8,"length":74.3,"count":1,"bays":3}
]</textarea>
        <div class="hint">type=normal普通棚/linked联动棚；width=宽度(米)，length=长度(米)，count=数量，bays=联动跨数（普通棚可不填）</div>
      </div>
      
      <div class="actions-row">
        <button class="btn" id="runBtn">生成清单与图纸</button>
                <button class="btn ghost" id="exportCsvBtn">导出材料清单 CSV</button>
        <button class="btn ghost" id="exportSvgBtn">导出工程图 SVG</button>
        <button class="btn ghost" id="exportPngBtn">导出工程图 PNG</button>
      </div>

      <div class="out" id="summary"></div>
      <div class="out" id="materials"></div>
      <div class="out" id="drawings"></div>
    </section>
  </main>
  <script src="greenhouse.js"></script>
</body>
</html>
