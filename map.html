<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>地图</title>

  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <style>
    body { margin:0; font-family: system-ui, "Microsoft YaHei"; }
    #map { height: 100vh; }
    .bar{
      position: fixed; left: 12px; top: 12px; z-index: 999;
      padding: 10px 12px; border-radius: 12px;
      background: rgba(20,20,30,0.75); color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
      max-width: min(420px, calc(100vw - 24px));
    }
    .bar a{ color: rgba(180,220,255,0.95); text-decoration: none; }
    .bar a:hover{ text-decoration: underline; }
    .small{ font-size: 12px; opacity: .8; margin-top: 4px; }
    .btn{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:10px;background:#2f6fed;color:#fff;text-decoration:none;font-size:12px;}
  </style>
</head>
<body>
  <div class="bar">
    <div><b id="title">地图</b> · <a href="./">回首页</a> · <a href="./planets.html">行星</a></div>
    <div class="small" id="desc">提示：从首页“世界时间”点进来会自动定位城市。</div>
    <a class="btn" id="backHomeBtn" href="./">返回首页应用天气位置</a>
  </div>
  <div id="map"></div>

  <script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    const CITIES = {
      beijing: { name: "北京", lat: 39.9042, lng: 116.4074, z: 11 },
      london: { name: "伦敦", lat: 51.5074, lng: -0.1278, z: 11 },
      newyork: { name: "纽约", lat: 40.7128, lng: -74.0060, z: 11 },
      la: { name: "洛杉矶", lat: 34.0522, lng: -118.2437, z: 11 },
      luhansk: { name: "卢甘斯克", lat: 48.5740, lng: 39.3078, z: 10 }
    };

    function getParam(key){ return new URLSearchParams(location.search).get(key); }

    function saveWeatherLocation(lat, lng, label){
      const payload = { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)), label };
      localStorage.setItem("weatherPickedLocation", JSON.stringify(payload));
      localStorage.setItem("weatherPreset", "picked");
      return payload;
    }

    const mode = (getParam("mode") || "").toLowerCase();
    const backHomeBtn = document.getElementById("backHomeBtn");
    const pickerMode = mode === "weather-picker";
    const startCity = CITIES[(getParam("city") || "luhansk").toLowerCase()] || CITIES.luhansk;
    const map = L.map("map").setView([startCity.lat, startCity.lng], pickerMode ? 5 : startCity.z);

    L.tileLayer("https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scl=1&style=7&x={x}&y={y}&z={z}", {
      subdomains: "1234", maxZoom: 19, attribution: "© 高德地图"
    }).addTo(map);

    let marker = null;

    function setPicked(lat, lng, label){
      if (marker) marker.remove();
      marker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();
    }

    if (pickerMode) {
      document.getElementById("title").textContent = "地图选点：天气背景";
      document.getElementById("desc").textContent = "点击地图任意位置设置天气位置，返回首页后会自动应用该位置的实时天气背景。";
      if (backHomeBtn) backHomeBtn.href = "./?weather_picked=1";
      map.on("click", (event) => {
        const { lat, lng } = event.latlng;
        const payload = saveWeatherLocation(lat, lng, `地图选点 ${lat.toFixed(3)}, ${lng.toFixed(3)}`);
        setPicked(payload.lat, payload.lng, "已保存为天气位置");
        document.getElementById("desc").textContent = `已保存天气位置：${payload.lat.toFixed(4)}, ${payload.lng.toFixed(4)}。返回首页后自动生效。`;
      });
      setPicked(startCity.lat, startCity.lng, `默认：${startCity.name}`);
    } else {
      const cityKey = (getParam("city") || "").toLowerCase();
      if (CITIES[cityKey]) {
        const city = CITIES[cityKey];
        document.getElementById("title").textContent = `地图：${city.name}`;
        document.getElementById("desc").textContent = `已定位到 ${city.name}（${city.lat.toFixed(4)}, ${city.lng.toFixed(4)}）`;
        map.setView([city.lat, city.lng], city.z);
        setPicked(city.lat, city.lng, city.name);
      } else {
        document.getElementById("desc").textContent = "你也可以在首页点城市按钮，或在地址后加 ?city=beijing / london / newyork / la";
        setPicked(startCity.lat, startCity.lng, startCity.name);
      }
    }
  </script>
</body>
</html>
